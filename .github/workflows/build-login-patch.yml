name: Build patched login image

on:
  push:
    branches: [fix/securite-4.20.3]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests of the sessions cookie (Forestar patch)
        run: pnpm --dir apps/login exec vitest --run src/lib/server/cookies.test.ts
      - run: pnpm nx run login:build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: forestar-be
          password: ${{ secrets.PACKAGES_TOKEN }}
      # Tag is unique per commit (short SHA) instead of a reused mutable tag,
      # so a compose.yaml reference stays readable and unambiguous without
      # needing to pin an opaque @sha256 digest to know which build it is.
      - name: Compute image tag
        id: image
        run: echo "tag=v4.20.3-cookie-fix-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - run: docker build -t ghcr.io/forestar-be/zitadel-login:${{ steps.image.outputs.tag }} apps/login
      - run: docker push ghcr.io/forestar-be/zitadel-login:${{ steps.image.outputs.tag }}
      - run: docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/forestar-be/zitadel-login:${{ steps.image.outputs.tag }}
