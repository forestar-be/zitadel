name: Build patched login image

on:
  push:
    branches: [fix/totp-session-lifetime]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run login:build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: forestar-be
          password: ${{ secrets.PACKAGES_TOKEN }}
      - run: docker build -t ghcr.io/forestar-be/zitadel-login:v4.16.2-totp-fix apps/login
      - run: docker push ghcr.io/forestar-be/zitadel-login:v4.16.2-totp-fix
      - run: docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/forestar-be/zitadel-login:v4.16.2-totp-fix
